name: B language checks
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix experiments/node-interop --ignore-scripts --no-audit --no-fund
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: python -m pip install -e '.[dev]'
      - run: dotnet build dotnet/B.NetHost/B.NetHost.csproj -c Release --nologo
      - run: pytest -q
      - run: python experiments/ordered-history/check.py
      - run: python experiments/ordered-history/validate_boolean_loop.py
      - name: Check decision-register pilot submissions
        run: |
          python experiments/register-pilot/replay.py
          python experiments/register-pilot/availability/replay.py
      - run: python experiments/handoff-pilot/replay.py
      - run: python experiments/shorthand-pilot/replay.py
      - run: python experiments/shorthand-pilot/sequence/replay.py
      - run: python experiments/subtitle-maintenance/replay.py
      - run: python experiments/node-interop/measure.py
      - run: b check experiments/node-interop/channel.bee --strict
      - name: Run one B program across Python, .NET and Node
        run: |
          python - <<'PYTHON'
          import subprocess
          output = subprocess.check_output(["b", "run", "experiments/node-interop/channel.bee"], text=True)
          assert output.splitlines() == ["True", "False", "False"], output
          PYTHON
      - run: b check examples/intent/layout.bee --joint examples/intent/uniform.json
      - run: b check examples/polyglot.b --strict
      - run: b run examples/polyglot.b
      - run: b check examples/polyglot.bsrc --strict
      - run: b run examples/polyglot.bsrc
      - run: b check examples/typed_foreign.bsrc --strict --json
      - run: b check examples/polyglot.bee --strict
      - run: b run examples/polyglot.bee
      - run: b check examples/auto_discovery.bee --strict
      - run: b run examples/auto_discovery.bee
      - run: b inspect py:b_examples.demo_lib --json
      - run: b inspect net:System.Math --verify --json
      - run: b check examples/polytypes.bee --strict --json
      - run: b run examples/polytypes.bee
      - run: b check examples/hello.b4 --strict
      - run: b inspect py:b_examples.poly_lib --json
      - run: b check examples/coalesce.bee --strict
      - run: b run examples/coalesce.bee

      - run: b ir examples/polyglot.bee --strict > /tmp/bir.json
      - run: python -c "import json; d=json.load(open('/tmp/bir.json')); assert d['schema']=='bir' and d['version']==2"
      - run: b audit py:b_examples.demo_lib --json
      - run: b check examples/adopt.bee --strict --json
      - run: b run examples/adopt.bee
      - run: b adopt-audit py:b_examples.pure_kernels --json
      - run: b adopt-audit py:statistics --json
      - run: python -m scripts.benchmark_adoption
      - run: b check examples/contracts.bee --strict --json
      - run: b run examples/contracts.bee
      - run: b check examples/effects.bee --strict --json
      - run: b run examples/effects.bee
      - run: python -c "import json,subprocess; d=json.loads(subprocess.check_output(['b','ir','examples/contracts.bee','--strict'])); assert d['version']==2 and d['statements'][1]['postcondition_status']=='proved-interval'"
  large-library-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e '.[dev]' 'numpy>=2,<3'
      - run: b audit py:numpy --json
      - run: b run examples/numpy_unchecked.bee
      - run: pytest -q tests/test_audit.py
