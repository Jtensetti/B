[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "b-language"
version = "0.11.0"
description = "B: a typed programming language with semantic IR, contracts, effects and compositional contract analysis"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["lark>=1.2,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
b = "b_lang.cli:main"

[tool.setuptools.packages.find]
include = ["b_lang*", "b_examples*"]

[tool.setuptools.package-data]
b_lang = ["*.lark", "*.json"]
b_examples = ["*.pyi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
